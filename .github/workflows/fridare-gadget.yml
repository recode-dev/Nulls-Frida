name: Fridare Gadget Patch

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Тег Frida; пусто = последний стабильный релиз"
        required: false
        default: ""
      custom_source_url:
        description: "Необязательно: URL своего исходного .dylib"
        required: false
        default: ""

jobs:
  patch-gadget:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей и Fridare
        run: |
          set -euo pipefail
          command -v git
          command -v curl
          command -v xz || brew install xz
          command -v lipo
          chmod +x tools/install_fridare.sh tools/patch_gadget.sh
          bash tools/install_fridare.sh

      - name: Определение версии и скачивание гаджета
        id: fetch
        run: |
          set -euo pipefail

          VERSION="${{ inputs.frida_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | jq -r '.tag_name')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "[-] версия: $VERSION"

          SRC_URL="${{ inputs.custom_source_url }}"
          if [ -n "$SRC_URL" ]; then
            curl -fL --retry 3 --max-time 600 -o custom-gadget.dylib "$SRC_URL"
            echo "INPUT_DYLIB=custom-gadget.dylib" >> "$GITHUB_ENV"
            exit 0
          fi

          BASE="https://github.com/frida/frida/releases/download/${VERSION}"
          ASSETS=(
            "frida-gadget-${VERSION}-ios-universal.dylib.gz"
            "frida-gadget-${VERSION}-ios-universal.dylib.xz"
          )

          DOWNLOADED=""
          for asset in "${ASSETS[@]}"; do
            echo "[-] пробую: $BASE/$asset"
            HTTP_CODE=$(curl -sL -o "$asset" -w "%{http_code}" "$BASE/$asset" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              DOWNLOADED="$asset"
              break
            fi
            rm -f "$asset"
          done

          if [ -z "$DOWNLOADED" ]; then
            echo "[-] прямые ссылки не сработали, запрашиваю список ассетов через API..."
            REAL_ASSET=$(curl -s "https://api.github.com/repos/frida/frida/releases/tags/${VERSION}" \
              | jq -r '.assets[]?.name | select(test("ios-universal") and test("\\.(gz|xz)$"))' \
              | head -1 || true)
            if [ -z "$REAL_ASSET" ]; then
              echo "[-] в релизе ${VERSION} нет ios-universal ассета"
              exit 1
            fi
            echo "[-] API подсказал имя: $REAL_ASSET"
            curl -fL --retry 3 --max-time 600 -o "$REAL_ASSET" "$BASE/$REAL_ASSET"
            DOWNLOADED="$REAL_ASSET"
          fi

          case "$DOWNLOADED" in
            *.gz)  gzip -dk "$DOWNLOADED" && INPUT_DYLIB="${DOWNLOADED%.gz}" ;;
            *.xz)  unxz -f "$DOWNLOADED" && INPUT_DYLIB="${DOWNLOADED%.xz}" ;;
            *)     echo "[-] неизвестное расширение: $DOWNLOADED"; exit 1 ;;
          esac

          [ -f "$INPUT_DYLIB" ] || { echo "[-] распаковка не дала dylib"; exit 1; }
          echo "INPUT_DYLIB=$INPUT_DYLIB" >> "$GITHUB_ENV"
          echo "[-] готов исходный гаджет: $INPUT_DYLIB"

      - name: Патч гаджета через Fridare
        run: |
          set -euo pipefail
          bash tools/patch_gadget.sh "$INPUT_DYLIB"

          PATCHED=$(find . -maxdepth 2 -name "*.dylib" -newer "$INPUT_DYLIB" ! -name "$INPUT_DYLIB" | head -1)
          if [ -z "$PATCHED" ]; then
            PATCHED=$(find . -maxdepth 2 -name "*.dylib" ! -name "$INPUT_DYLIB" ! -name "custom-gadget.dylib" | head -1)
          fi
          [ -n "$PATCHED" ] || { echo "[-] не удалось найти созданный файл"; exit 1; }
          echo "PATCHED_DYLIB=$PATCHED" >> "$GITHUB_ENV"
          echo "[+] создан файл: $PATCHED"

      - name: Проверка и загрузка артефакта
        run: |
          set -euo pipefail
          [ -f "$PATCHED_DYLIB" ] || { echo "[-] нет файла: $PATCHED_DYLIB"; exit 1; }
          echo "[+] размер: $(du -h "$PATCHED_DYLIB" | cut -f1)"
          echo "[+] архитектуры: $(lipo -archs "$PATCHED_DYLIB" 2>/dev/null || echo 'n/a')"
          if strings "$PATCHED_DYLIB" | grep -qi 'LIBFRIDA'; then
            echo "[!] в бинарнике всё ещё встречается LIBFRIDA"
          else
            echo "[+] явных строк LIBFRIDA не найдено"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fridare-gadget-${{ env.VERSION || 'latest' }}
          path: ${{ env.PATCHED_DYLIB }}
          compression-level: 0
          if-no-files-found: error