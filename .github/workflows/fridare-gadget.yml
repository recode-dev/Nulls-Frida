name: Fridare Gadget Patch

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Тег Frida; пусто = последний релиз"
        required: false
        default: ""
      custom_source_url:
        description: "Необязательно: URL своего исходного .dylib"
        required: false
        default: ""

jobs:
  patch-gadget:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей и Fridare
        run: |
          set -euo pipefail
          command -v git && command -v curl
          command -v xz || brew install xz
          chmod +x tools/install_fridare.sh tools/patch_gadget.sh
          bash tools/install_fridare.sh

      - name: Определение версии и скачивание гаджета
        id: fetch
        run: |
          set -euo pipefail
          VERSION="${{ inputs.frida_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          SRC_URL="${{ inputs.custom_source_url }}"
          if [ -z "$SRC_URL" ]; then
            SRC_URL="https://github.com/frida/frida/releases/download/${VERSION}/frida-gadget-${VERSION}-ios-universal.dylib.xz"
            curl -fL --retry 3 --max-time 600 -o gadget.dylib.xz "$SRC_URL"
            unxz -f gadget.dylib.xz
            INPUT_DYLIB="gadget.dylib"
          else
            curl -fL --retry 3 --max-time 600 -o custom-gadget.dylib "$SRC_URL"
            INPUT_DYLIB="custom-gadget.dylib"
          fi
          echo "INPUT_DYLIB=$INPUT_DYLIB" >> "$GITHUB_ENV"

      - name: Патч гаджета через Fridare (со случайным именем)
        run: |
          set -euo pipefail
          bash tools/patch_gadget.sh "$INPUT_DYLIB"

          PATCHED=$(find . -maxdepth 1 -name "*.dylib" -newer "$INPUT_DYLIB" | head -1)
          if [ -z "$PATCHED" ]; then
            # Если не нашли, пробуем найти файл с произвольным именем
            PATCHED=$(find . -maxdepth 1 -name "*.dylib" ! -name "$INPUT_DYLIB" | head -1)
          fi
          [ -n "$PATCHED" ] || { echo "[-] не удалось найти созданный файл"; exit 1; }
          echo "PATCHED_DYLIB=$PATCHED" >> "$GITHUB_ENV"
          echo "[+] создан файл: $PATCHED"

      - name: Проверка и загрузка артефакта
        run: |
          set -euo pipefail
          echo "[+] размер: $(du -h "$PATCHED_DYLIB" | cut -f1)"
          echo "[+] архитектуры: $(lipo -archs "$PATCHED_DYLIB" 2>/dev/null || echo 'n/a')"
          if strings "$PATCHED_DYLIB" | grep -qi 'LIBFRIDA'; then
            echo "[!] в бинарнике всё ещё встречается LIBFRIDA"
          else
            echo "[+] явных строк LIBFRIDA не найдено"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fridare-gadget-${{ env.VERSION || 'latest' }}
          path: ${{ env.PATCHED_DYLIB }}
          if-no-files-found: error