name: Fridare Gadget Patch

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Тег Frida; пусто = последний релиз"
        required: false
        default: ""
      gadget_name:
        description: "Имя выходного файла гаджета"
        required: false
        default: "Recoil.dylib"
      custom_source_url:
        description: "Необязательно: URL своего исходного .dylib"
        required: false
        default: ""

jobs:
  patch-gadget:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей и Fridare
        run: |
          set -euo pipefail
          command -v git
          command -v curl
          command -v xz || brew install xz
          command -v lipo
          chmod +x tools/install_fridare.sh tools/patch_gadget.sh
          bash tools/install_fridare.sh

      - name: Определение версии и скачивание гаджета
        id: fetch
        run: |
          set -euo pipefail

          VERSION="${{ inputs.frida_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | grep -oP '"tag_name": "\K[^"]+')
            echo "[-] версия не указана, использую последний релиз: $VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          SRC_URL="${{ inputs.custom_source_url }}"
          if [ -z "$SRC_URL" ]; then
            SRC_URL="https://github.com/frida/frida/releases/download/${VERSION}/frida-gadget-${VERSION}-ios-universal.dylib.xz"
            echo "[-] качаю официальный гаджет: $SRC_URL"
            curl -fL --retry 3 --max-time 600 -o work-frida-gadget.dylib.xz "$SRC_URL"
            unxz -f work-frida-gadget.dylib.xz
            INPUT_DYLIB="work-frida-gadget.dylib"
          else
            echo "[-] качаю пользовательский гаджет: $SRC_URL"
            curl -fL --retry 3 --max-time 600 -o custom-gadget.dylib "$SRC_URL"
            INPUT_DYLIB="custom-gadget.dylib"
          fi

          [ -f "$INPUT_DYLIB" ] || { echo "[-] исходный гаджет не получен"; exit 1; }
          echo "INPUT_DYLIB=$INPUT_DYLIB" >> "$GITHUB_ENV"
          echo "input_dylib=$INPUT_DYLIB" >> "$GITHUB_OUTPUT"

      - name: Патч гаджета через Fridare
        run: |
          set -euo pipefail
          OUTPUT_NAME="${{ inputs.gadget_name }}"
          case "$OUTPUT_NAME" in
            *.dylib) ;;
            *) OUTPUT_NAME="${OUTPUT_NAME}.dylib" ;;
          esac
          echo "OUTPUT_NAME=$OUTPUT_NAME" >> "$GITHUB_ENV"
          bash tools/patch_gadget.sh "$INPUT_DYLIB" "$OUTPUT_NAME"

      - name: Проверка и загрузка артефакта
        run: |
          set -euo pipefail
          [ -f "$OUTPUT_NAME" ] || { echo "[-] итоговый файл не найден: $OUTPUT_NAME"; exit 1; }
          echo "[+] размер: $(du -h "$OUTPUT_NAME" | cut -f1)"
          echo "[+] архитектуры: $(lipo -archs "$OUTPUT_NAME" 2>/dev/null || echo 'n/a')"
          if strings "$OUTPUT_NAME" | grep -qi 'LIBFRIDA'; then
            echo "[!] в бинарнике всё ещё встречается LIBFRIDA"
          else
            echo "[+] явных строк LIBFRIDA не найдено"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fridare-gadget-${{ env.VERSION || 'latest' }}
          path: ${{ env.OUTPUT_NAME }}
          compression-level: 0
          if-no-files-found: error