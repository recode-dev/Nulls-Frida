name: FridaGadget

on:
  workflow_dispatch:
    inputs:
      url:
        description: ipa endpoint
        required: false
        default: https://nulls.ee/bs_latest_i
      version:
        description: тег Frida; пусто = последний релиз
        default: ""
      drop_lc:
        description: вырезать загрузку Frida.framework разработчика IPA
        type: boolean
        default: true
      custom_gadget_url:
        description: "необязательно: URL своей сборки FridaGadget.dylib (релизная не качается)"
        default: ""
      max_mb:
        description: упасть, если dylib гаджета в итоговом IPA больше, МБ (0 = не проверять)
        default: "40"
      script:
        description: имя JS рядом с конфигом (это же имя идёт в "path" конфига)
        default: "agent.js"
      script_file:
        description: "необязательно: путь к .js в репозитории, который вшить в бандл"
        default: ""
      code_signing:
        description: режим code_signing в конфиге гаджета
        default: "required"

jobs:
  patch:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      OBJECTION_VERSION: "1.12.5"
      IPA_URL: ${{ inputs.url }}
      FRIDA_VERSION: ${{ inputs.version }}
      CUSTOM_GADGET_URL: ${{ inputs.custom_gadget_url }}
      MAX_MB: ${{ inputs.max_mb }}
      SCRIPT_NAME: ${{ inputs.script }}
      SCRIPT_FILE: ${{ inputs.script_file }}
      CODE_SIGNING: ${{ inputs.code_signing }}

    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          set -euo pipefail
          mkdir -p work out

          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet lief "objection==${OBJECTION_VERSION}"

          git clone --depth 1 https://github.com/Tyilo/insert_dylib insert_dylib-src
          (cd insert_dylib-src && xcodebuild -configuration Release >/dev/null)
          BIN="$(find insert_dylib-src -type f -name insert_dylib -perm -111 | head -1)"
          [ -n "$BIN" ] || { echo "insert_dylib не собрался"; exit 1; }
          sudo cp -f "$BIN" /usr/local/bin/insert_dylib
          chmod +x /usr/local/bin/insert_dylib

          python3 -c 'import lief; print("lief", lief.__version__)'
          objection version 2>&1 | tail -1 || true
          for c in insert_dylib codesign security zip unzip plutil xcodebuild; do
            command -v "$c" || { echo "нет обязательной команды: $c"; exit 1; }
          done

      - name: fetch
        run: |
          set -euo pipefail
          python3 tools/ExecutablePatch.py --resolve "$IPA_URL" | tee work/url.txt
          curl -fL --retry 3 --retry-delay 5 --max-time 900 -o work/app.ipa "$(tail -1 work/url.txt)"
          ls -l work/app.ipa

          unzip -tq work/app.ipa >/dev/null
          APP_ENTRY="$(unzip -Z1 work/app.ipa | grep -E '^Payload/[^/]+\.app/$' | head -1)"
          [ -n "$APP_ENTRY" ] || { echo "в IPA нет Payload/*.app"; exit 1; }
          echo "APP_ENTRY=$APP_ENTRY" >> "$GITHUB_ENV"

          mkdir -p work/probe
          unzip -o -q work/app.ipa "$APP_ENTRY/Info.plist" -d work/probe
          python3 - <<'PY'
          import plistlib, pathlib, os
          p = next(pathlib.Path('work/probe/Payload').glob('*.app/Info.plist'))
          d = plistlib.loads(p.read_bytes())
          print('CFBundleIdentifier:', d.get('CFBundleIdentifier'))
          print('CFBundleExecutable:', d.get('CFBundleExecutable'))
          print('CFBundleShortVersionString:', d.get('CFBundleShortVersionString'))
          with open('work/exec-name.txt', 'w') as f:
              f.write(d.get('CFBundleExecutable') or '')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('BUNDLE_ID_ORIG=%s\n' % d.get('CFBundleIdentifier'))
              f.write('EXEC_NAME=%s\n' % d.get('CFBundleExecutable'))
          PY

          BIN_PATH="$(dirname "$APP_ENTRY")/$(cat work/exec-name.txt)"
          unzip -o -q work/app.ipa "$BIN_PATH" -d work/probe
          CRYPTID="$(otool -l "work/probe/$BIN_PATH" | awk '/LC_ENCRYPTION_INFO/{f=1} f&&/^ *cryptid/{print $2; exit}')"
          echo "cryptid=${CRYPTID:-<нет LC_ENCRYPTION_INFO>}"
          if [ "${CRYPTID:-0}" != "0" ]; then
            echo "IPA зашифрован FairPlay (cryptid=$CRYPTID). Патч и переподпись бессмысленны —"
            echo "нужен расшифрованный дамп. Прерываю."
            exit 1
          fi

          echo "== frida-записи в исходном IPA =="
          unzip -Z1 work/app.ipa | grep -i frida | sed -n '1,20p' || echo "(нет)"

      - name: strip developer frida
        run: |
          set -euo pipefail
          ARGS=(--ipa work/app.ipa --exe-dir exe --out work/nofrida.ipa)
          if [ "${{ inputs.drop_lc }}" = "true" ]; then
            ARGS+=(--drop-lc)
          else
            echo "внимание: drop_lc=false, висячий LC_LOAD_DYLIB останется и приложение не запустится"
          fi
          python3 tools/ExecutablePatch.py "${ARGS[@]}" | tee work/strip.log
          ls -l work/nofrida.ipa exe/

      - name: gadget config
        run: |
          set -euo pipefail
          mkdir -p work/gadget
          cat > work/gadget/FridaGadget.config <<CFG
          {
            "interaction": {
              "type": "script",
              "path": "$SCRIPT_NAME",
              "on_change": "reload",
              "parameters": {}
            },
            "code_signing": "$CODE_SIGNING"
          }
          CFG
          cat work/gadget/FridaGadget.config

          if [ -n "$SCRIPT_FILE" ]; then
            [ -f "$SCRIPT_FILE" ] || { echo "нет файла скрипта: $SCRIPT_FILE"; exit 1; }
            cp "$SCRIPT_FILE" "work/gadget/$SCRIPT_NAME"
            ls -l "work/gadget/$SCRIPT_NAME"
          fi

      - name: custom gadget (optional)
        if: inputs.custom_gadget_url != ''
        run: |
          set -euo pipefail
          GP="$(python3 -c 'from objection.utils.patchers.ios import IosGadget; print(IosGadget.ios_dylib_gadget_path)')"
          echo "objection gadget path: $GP"
          mkdir -p "$(dirname "$GP")"
          curl -fL --retry 3 --max-time 600 "$CUSTOM_GADGET_URL" -o "$GP"
          lipo -archs "$GP" || true
          ls -l "$GP"

      - name: inject
        env:
          IPA_PATH: work/nofrida.ipa
          GADGET_CONFIG: work/gadget/FridaGadget.config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil

          from objection.utils.patchers.github import Github
          from objection.utils.patchers.ios import IosGadget, IosPatcher

          ipa = os.environ['IPA_PATH']
          cfg = os.environ['GADGET_CONFIG']
          script_name = os.environ['SCRIPT_NAME']
          want = (os.environ.get('FRIDA_VERSION') or '').strip()
          custom = (os.environ.get('CUSTOM_GADGET_URL') or '').strip()

          gh = Github()
          version = want or gh.get_latest_version()
          print('frida release:', version)

          gadget = IosGadget(Github(gadget_version=version))
          gadget_path = gadget.get_gadget_path()

          if custom:
              if not os.path.exists(gadget_path):
                  raise SystemExit('нет файла своей сборки гаджета: %s' % gadget_path)
              print('использую свою сборку:', gadget_path)
          else:
              print('качаю релизный гаджет...')
              gadget.download().unpack().set_local_version('ios_universal', version).cleanup()

          size = os.path.getsize(gadget_path)
          print('gadget: %s (%d bytes)' % (gadget_path, size))

          p = IosPatcher(skip_cleanup=True)
          p.extract_ipa(False, ipa_source=ipa)
          p.set_application_binary()
          p.patch_and_codesign_binary(
              frida_gadget=gadget_path,
              codesign_signature='-',
              gadget_config=cfg)

          app = p.app_folder
          frameworks = os.path.join(app, 'Frameworks')

          shutil.copyfile(cfg, os.path.join(frameworks, 'config.json'))

          script_src = os.path.join('work', 'gadget', script_name)
          if os.path.exists(script_src):
              shutil.copyfile(script_src, os.path.join(frameworks, script_name))
              print('вшит скрипт:', script_name)

          dest = os.path.join('work', 'patched-app', os.path.basename(app))
          shutil.rmtree(dest, ignore_errors=True)
          shutil.copytree(app, dest, symlinks=True)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('APP_NAME=%s\n' % os.path.basename(app))
              f.write('PATCHED_APP_DIR=%s\n' % dest)
              f.write('GADGET_VERSION=%s\n' % version)
              f.write('GADGET_SIZE=%d\n' % size)
          print('inject ok ->', dest)
          PY

          ls -la "$PATCHED_APP_DIR/Frameworks"

      - name: ad-hoc sign and pack
        run: |
          set -euo pipefail
          APP="$PATCHED_APP_DIR"
          EXEC="$APP/$EXEC_NAME"
          [ -f "$EXEC" ] || { echo "нет исполняемого файла $EXEC"; exit 1; }

          ORIG_BIN="$(dirname "$APP_ENTRY")/$EXEC_NAME"
          rm -rf work/orig && mkdir -p work/orig
          unzip -o -q work/app.ipa "$ORIG_BIN" -d work/orig
          ENTS=""
          if codesign -d --entitlements :- "work/orig/$ORIG_BIN" > work/ents.plist 2>/dev/null \
             && [ -s work/ents.plist ] && [ "$(head -c 1 work/ents.plist)" = "<" ]; then
            ENTS="--entitlements work/ents.plist"
            echo "entitlements оригинала подключены"
          else
            echo "entitlements не найдены — подписываю без них"
          fi

          find "$APP" -type f -name '*.dylib' -print0 \
            | while IFS= read -r -d '' f; do codesign -f -s - "$f"; done
          codesign -f -s - $ENTS "$EXEC"
          codesign -f -s - "$APP"

          echo "== ad-hoc подписи =="
          codesign -dvv "$EXEC" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvv "$APP" 2>&1 | grep -E 'Identifier|Signature' || true

          rm -rf work/build && mkdir -p work/build/Payload
          cp -R "$APP" work/build/Payload/
          OUT="$GITHUB_WORKSPACE/out/$(basename "${APP%.app}")-frida.ipa"
          (cd work/build && zip -qry "$OUT" Payload)
          echo "OUT_IPA=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT"

      - name: verify
        run: |
          set -euo pipefail
          rm -rf work/verify && mkdir -p work/verify
          unzip -q "$OUT_IPA" -d work/verify
          APP_VERIFY="work/verify/${APP_ENTRY%/}"
          BIN_PATH="${APP_ENTRY%/}/$EXEC_NAME"

          echo "== Frameworks =="
          ls -la "$APP_VERIFY/Frameworks"

          for f in Frameworks/FridaGadget.dylib Frameworks/FridaGadget.config Frameworks/config.json; do
            [ -f "$APP_VERIFY/$f" ] || { echo "в патченом IPA нет $f"; exit 1; }
          done
          if [ -n "$SCRIPT_FILE" ]; then
            [ -f "$APP_VERIFY/Frameworks/$SCRIPT_NAME" ] || { echo "в патченом IPA нет скрипта $SCRIPT_NAME"; exit 1; }
          fi

          echo "== frida-записи в итоговом IPA (должны быть только наши) =="
          unzip -Z1 "$OUT_IPA" | grep -i frida
          if unzip -Z1 "$OUT_IPA" | grep -qi 'Frida\.framework'; then
            echo "Frida.framework разработчика всё ещё в IPA"; exit 1
          fi
          FOREIGN="$(unzip -Z1 "$OUT_IPA" | grep -i frida \
            | grep -viE 'Frameworks/(FridaGadget\.dylib|FridaGadget\.config|config\.json)' \
            | grep -v "${EXEC_NAME}$" || true)"
          [ -z "$FOREIGN" ] || { echo "остались чужие frida-записи:"; echo "$FOREIGN"; exit 1; }

          echo "== load commands =="
          otool -l "work/verify/$BIN_PATH" | grep -A3 LC_LOAD_DYLIB | grep -i frida \
            || { echo "в бинаре нет LC_LOAD_DYLIB на FridaGadget"; exit 1; }
          if otool -l "work/verify/$BIN_PATH" | grep -A3 LC_LOAD_DYLIB | grep -qi 'Frida\.framework'; then
            echo "висячий LC_LOAD_DYLIB на Frida.framework остался"; exit 1
          fi
          otool -l "work/verify/$BIN_PATH" | grep -A2 LC_LOAD_DYLIB | grep -c 'name ' | sed 's/^/LC_LOAD_DYLIB всего: /'

          echo "== гаджет =="
          echo "версия: $GADGET_VERSION"
          python3 - <<'PY'
          import os, sys
          p = 'work/verify/%s/Frameworks/FridaGadget.dylib' % os.environ['APP_ENTRY'].rstrip('/')
          n = os.path.getsize(p)
          print('FridaGadget %d bytes = %.2f MB' % (n, n / 1048576.0))
          cap = float(os.environ['MAX_MB'])
          if cap > 0 and n / 1048576.0 > cap:
              print('больше лимита %.2f MB' % cap)
              sys.exit(1)
          PY

          echo "== подписи (ожидается adhoc) =="
          codesign -dvvv "$APP_VERIFY/Frameworks/FridaGadget.dylib" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvvv "$APP_VERIFY/$EXEC_NAME" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvvv "$APP_VERIFY" 2>&1 | grep -E 'Identifier|Signature' || true

          echo "== целостность =="
          unzip -tq "$OUT_IPA" >/dev/null && echo "zip ok"
          ls -l "$OUT_IPA"

      - name: upload exec
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exec
          path: exe/*
          compression-level: 0
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FridaGadget-${{ inputs.version || 'latest' }}-${{ github.run_number }}
          path: |
            out/*.ipa
            work/gadget/FridaGadget.config
            work/strip.log
            work/probe
          if-no-files-found: warn
          compression-level: 0
