name: FridaGadget

on:
  workflow_dispatch:
    inputs:
      url:
        description: ipa endpoint
        required: false
        default: https://nulls.ee/bs_latest_i
      version:
        description: тег Frida; пусто = последний релиз
        default: ""
      drop_lc:
        description: вырезать загрузку Frida.framework разработчика IPA
        type: boolean
        default: true
      gadget_name:
        description: "имя файла гаджета в бандле; конфиг получит то же имя со .config"
        default: "Recoil.dylib"
      gadget_framework:
        description: "имя фреймворка в Frameworks; пусто = <имя гаджета без .dylib>.framework"
        default: ""
      custom_gadget_url:
        description: "необязательно: URL своей сборки гаджета (релизная не качается)"
        default: ""
      max_mb:
        description: упасть, если dylib гаджета в итоговом IPA больше, МБ (0 = не проверять)
        default: "60"
      script:
        description: имя JS-файла в бандле (это же имя идёт в "path" конфига)
        default: "agent.js"
      script_file:
        description: "необязательно: путь к .js в репозитории, который вшить в бандл"
        default: ""
      script_dir:
        description: "Documents (На iPhone -> приложение, не вшивается) | Frameworks | root | своя папка в .app"
        default: "Documents"
      code_signing:
        description: режим code_signing в конфиге гаджета
        default: "required"

jobs:
  patch:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      OBJECTION_VERSION: "1.12.5"
      IPA_URL: ${{ inputs.url }}
      FRIDA_VERSION: ${{ inputs.version }}
      CUSTOM_GADGET_URL: ${{ inputs.custom_gadget_url }}
      MAX_MB: ${{ inputs.max_mb }}
      SCRIPT_NAME: ${{ inputs.script }}
      SCRIPT_FILE: ${{ inputs.script_file }}
      SCRIPT_DIR: ${{ inputs.script_dir }}
      CODE_SIGNING: ${{ inputs.code_signing }}
      GADGET_NAME: ${{ inputs.gadget_name }}
      GADGET_FRAMEWORK: ${{ inputs.gadget_framework }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: toolchain
        run: |
          set -euo pipefail
          mkdir -p work out tools/bin

          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet lief "objection==${OBJECTION_VERSION}"

          printf '%s\n' '#!/bin/sh' 'echo "insert_dylib: заглушка; LC_LOAD_DYLIB вставляет LIEF в шаге inject" >&2' 'exit 1' > tools/bin/insert_dylib
          chmod +x tools/bin/insert_dylib
          echo "$GITHUB_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
          test -x tools/bin/insert_dylib

          python3 -c 'import lief; print("lief", lief.__version__)'
          objection version 2>&1 | tail -1 || true
          npm install -g applesign
          for c in codesign security zip unzip plutil xcodebuild applesign; do
            command -v "$c" || { echo "нет обязательной команды: $c"; exit 1; }
          done
          echo "обязательные команды на месте; внешний insert_dylib не нужен"

      - name: fetch
        run: |
          set -euo pipefail
          python3 tools/ExecutablePatch.py --resolve "$IPA_URL" | tee work/url.txt
          curl -fL --retry 3 --retry-delay 5 --max-time 900 -o work/app.ipa "$(tail -1 work/url.txt)"
          ls -l work/app.ipa

          unzip -tq work/app.ipa >/dev/null
          APP_INFO="$(unzip -Z1 work/app.ipa | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -1)"
          [ -n "$APP_INFO" ] || { echo "в IPA нет Payload/*.app/Info.plist"; exit 1; }
          APP_DIR="${APP_INFO%/Info.plist}"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "бандл: $APP_DIR"

          mkdir -p work/probe
          unzip -o -q work/app.ipa "$APP_DIR/Info.plist" -d work/probe
          python3 - <<'PY'
          import plistlib, pathlib, os
          p = next(pathlib.Path('work/probe/Payload').glob('*.app/Info.plist'))
          d = plistlib.loads(p.read_bytes())
          print('CFBundleIdentifier:', d.get('CFBundleIdentifier'))
          print('CFBundleExecutable:', d.get('CFBundleExecutable'))
          print('CFBundleShortVersionString:', d.get('CFBundleShortVersionString'))
          with open('work/exec-name.txt', 'w') as f:
              f.write(d.get('CFBundleExecutable') or '')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('BUNDLE_ID_ORIG=%s\n' % d.get('CFBundleIdentifier'))
              f.write('EXEC_NAME=%s\n' % d.get('CFBundleExecutable'))
          PY

          BIN_PATH="$APP_DIR/$(cat work/exec-name.txt)"
          unzip -o -q work/app.ipa "$BIN_PATH" -d work/probe
          CRYPTID="$(otool -l "work/probe/$BIN_PATH" | awk '/LC_ENCRYPTION_INFO/{f=1} f&&/^ *cryptid/{print $2; exit}')"
          echo "cryptid=${CRYPTID:-<нет LC_ENCRYPTION_INFO>}"
          if [ "${CRYPTID:-0}" != "0" ]; then
            echo "IPA зашифрован FairPlay (cryptid=$CRYPTID). Патч и переподпись бессмысленны —"
            echo "нужен расшифрованный дамп. Прерываю."
            exit 1
          fi

          echo "== frida-записи в исходном IPA =="
          unzip -Z1 work/app.ipa | grep -i frida | sed -n '1,20p' || echo "(нет)"

      - name: strip developer frida
        run: |
          set -euo pipefail
          ARGS=(--ipa work/app.ipa --exe-dir exe --out work/nofrida.ipa)
          if [ "${{ inputs.drop_lc }}" = "true" ]; then
            ARGS+=(--drop-lc)
          else
            echo "внимание: drop_lc=false, висячий LC_LOAD_DYLIB останется и приложение не запустится"
          fi
          python3 tools/ExecutablePatch.py "${ARGS[@]}" | tee work/strip.log
          ls -l work/nofrida.ipa exe/
          rm -f work/app.ipa
          echo "исходный work/app.ipa удалён; нетронутый исполняемый файл лежит в work/probe"
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: gadget config
        run: |
          set -euo pipefail
          mkdir -p work/gadget

          # имя гаджета задаёт и имя его конфига: гаджет ищет <stem>.config рядом с собой,
          # если он лежит отдельным dylib, а не внутри .framework
          GN="${GADGET_NAME:-Recoil.dylib}"
          case "$GN" in
            *.dylib) ;;
            *) echo "имя гаджета должно оканчиваться на .dylib: $GN"; exit 1 ;;
          esac
          STEM="${GN%.dylib}"
          printf '%s' "$STEM" | grep -Eq '^[A-Za-z0-9_.-]+$' \
            || { echo "недопустимые символы в имени гаджета: $GN"; exit 1; }
          echo "GADGET_DYLIB=$GN" >> "$GITHUB_ENV"
          echo "GADGET_STEM=$STEM" >> "$GITHUB_ENV"
          echo "гаджет: $GN (конфиг: $STEM.config)"

          # гаджет лежит не голым dylib, а внутри фреймворка (как Frida.framework/W.dylib
          # в app разработчика), поэтому имя фреймворка задаётся отдельно
          FWN="${GADGET_FRAMEWORK:-$STEM.framework}"
          case "$FWN" in
            *.framework) ;;
            *) echo "имя фреймворка должно оканчиваться на .framework: $FWN"; exit 1 ;;
          esac
          FW_STEM="${FWN%.framework}"
          [ -n "$FW_STEM" ] || { echo "пустое имя фреймворка: $FWN"; exit 1; }
          printf '%s' "$FW_STEM" | grep -Eq '^[A-Za-z0-9_-]+$' \
            || { echo "недопустимые символы в имени фреймворка: $FWN"; exit 1; }
          FW_ID="com.$(printf '%s' "$FW_STEM" | tr '[:upper:]' '[:lower:]')"
          echo "GADGET_FRAMEWORK=$FWN" >> "$GITHUB_ENV"
          echo "GADGET_FW_STEM=$FW_STEM" >> "$GITHUB_ENV"
          echo "фреймворк: $FWN -> Frameworks/$FWN/$GN"

          DIR="${SCRIPT_DIR:-Documents}"
          DIR="${DIR#/}"
          DIR="${DIR%/}"
          LC="$(printf '%s' "$DIR" | tr '[:upper:]' '[:lower:]')"
          EMBED=1
          case "$LC" in
            ""|documents)
              PATH_VALUE="$SCRIPT_NAME"
              DIR="Documents"
              EMBED=0
              ;;
            frameworks)
              PATH_VALUE="$SCRIPT_NAME"
              DIR="Frameworks"
              ;;
            root|".")
              PATH_VALUE="../$SCRIPT_NAME"
              DIR="root"
              ;;
            *)
              PATH_VALUE="../$DIR/$SCRIPT_NAME"
              ;;
          esac
          echo "скрипт: $DIR | path в конфиге: $PATH_VALUE | вшивается в IPA: $EMBED"
          echo "SCRIPT_DIR_NORM=$DIR" >> "$GITHUB_ENV"
          echo "SCRIPT_EMBED=$EMBED" >> "$GITHUB_ENV"
          cat > "work/gadget/$STEM.config" <<CFG
          {
            "interaction": {
              "type": "script",
              "path": "$PATH_VALUE",
              "on_change": "reload",
              "parameters": {}
            },
            "code_signing": "$CODE_SIGNING"
          }
          CFG
          cat "work/gadget/$STEM.config"
          cp "work/gadget/$STEM.config" work/gadget/config.json

          # внутри .framework гаджет берёт конфиг как config.json рядом с собой,
          # а рядом с самим бинарём ждёт <имя без .dylib>.config — кладём оба
          cat > "work/gadget/$FW_STEM.Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$GN</string>
              <key>CFBundleIdentifier</key>
              <string>$FW_ID</string>
              <key>CFBundleName</key>
              <string>$FW_STEM</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>MinimumOSVersion</key>
              <string>13.0</string>
          </dict>
          </plist>
          PLIST
          python3 -c "import plistlib,sys; plistlib.load(open(sys.argv[1],'rb'))" "work/gadget/$FW_STEM.Info.plist"
          echo "фреймворк $FWN укомплектован: $GN, $STEM.config, config.json, Info.plist"

          if [ -n "$SCRIPT_FILE" ]; then
            [ -f "$SCRIPT_FILE" ] || { echo "нет файла скрипта: $SCRIPT_FILE"; exit 1; }
            cp "$SCRIPT_FILE" "work/gadget/$SCRIPT_NAME"
            ls -l "work/gadget/$SCRIPT_NAME"
          elif [ "$EMBED" = "1" ]; then
            echo "script_dir=$DIR требует вшитый скрипт, а script_file пустой."
            echo "Без него в IPA не окажется $SCRIPT_NAME и гаджету будет нечего грузить —"
            echo "на устройстве это выглядит как «ничего не произошло»."
            exit 1
          fi

      - name: custom gadget (optional)
        if: inputs.custom_gadget_url != ''
        run: |
          set -euo pipefail
          GP="$(python3 -c 'from objection.utils.patchers.ios import IosGadget; print(IosGadget.ios_dylib_gadget_path)')"
          echo "objection gadget path: $GP"
          mkdir -p "$(dirname "$GP")"
          curl -fL --retry 3 --max-time 600 "$CUSTOM_GADGET_URL" -o "$GP"
          lipo -archs "$GP" || true
          ls -l "$GP"

      - name: inject
        env:
          IPA_PATH: work/nofrida.ipa
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess

          import requests
          from objection.utils.patchers.github import Github
          from objection.utils.patchers.ios import IosGadget, IosPatcher

          token = (os.environ.get('GITHUB_TOKEN') or '').strip()
          _s = requests.Session()
          _s.headers.update({
              'User-Agent': 'Nulls-Frida-Workflow',
              'Accept': 'application/vnd.github+json',
          })
          if token:
              _s.headers['Authorization'] = 'Bearer ' + token
          requests.get = _s.get

          def resolve_version():
              want = (os.environ.get('FRIDA_VERSION') or '').strip()
              if want:
                  return want
              try:
                  r = requests.get('https://api.github.com/repos/frida/frida/releases/latest', timeout=30)
                  print('github api: status %s, rate-limit remaining %s' % (
                      r.status_code, r.headers.get('x-ratelimit-remaining', 'n/a')))
                  tag = r.json().get('tag_name')
                  if tag:
                      return tag
                  print('github api: ответ без tag_name:', r.text[:300])
              except Exception as e:
                  print('github api недоступен: %r' % e)
              try:
                  r = requests.get('https://github.com/frida/frida/releases/latest', timeout=30)
                  tag = r.url.rstrip('/').rsplit('/', 1)[-1]
                  if re.fullmatch(r'\d+\.\d+\.\d+', tag):
                      print('версия из редиректа releases/latest:', tag)
                      return tag
                  print('редирект не дал версию:', r.url)
              except Exception as e:
                  print('редирект недоступен: %r' % e)
              raise SystemExit('не удалось определить последнюю версию Frida')

          ipa = os.environ['IPA_PATH']
          script_name = os.environ['SCRIPT_NAME']
          custom = (os.environ.get('CUSTOM_GADGET_URL') or '').strip()

          dylib_name = (os.environ.get('GADGET_DYLIB') or '').strip()
          stem = (os.environ.get('GADGET_STEM') or '').strip()
          if not dylib_name or not stem:
              raise SystemExit('GADGET_DYLIB/GADGET_STEM пусты — шаг gadget config не отработал')
          fw_name = (os.environ.get('GADGET_FRAMEWORK') or '').strip()
          if not fw_name.endswith('.framework'):
              raise SystemExit('GADGET_FRAMEWORK пусто или без .framework: %r' % fw_name)
          info_plist = os.path.join('work', 'gadget', os.environ['GADGET_FW_STEM'] + '.Info.plist')
          cfg = os.path.join('work', 'gadget', stem + '.config')
          if not os.path.exists(cfg):
              raise SystemExit('нет конфига гаджета: %s' % cfg)
          if not os.path.exists(info_plist):
              raise SystemExit('нет Info.plist фреймворка: %s' % info_plist)
          lc_path = '@executable_path/Frameworks/%s/%s' % (fw_name, dylib_name)
          print('гаджет: Frameworks/%s/%s, конфиг: %s' % (fw_name, dylib_name, cfg))

          if custom:
              version = (os.environ.get('FRIDA_VERSION') or '').strip() or 'custom'
          else:
              version = resolve_version()
          if version != 'custom' and not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('подозрительный номер версии: %r' % version)
          print('frida release:', version)

          gadget = IosGadget(Github(gadget_version=version))
          gadget_path = gadget.get_gadget_path()
          archive = os.path.join(os.path.expanduser('~'), '.objection', 'ios', 'FridaGadget.dylib.xz')

          if custom:
              if not os.path.exists(gadget_path):
                  raise SystemExit('нет файла своей сборки гаджета: %s' % gadget_path)
              print('использую свою сборку:', gadget_path)
          elif gadget.gadget_exists() and gadget.get_local_version('ios_universal') == version:
              print('гаджет уже в кэше:', gadget_path)
          else:
              dl = 'https://github.com/frida/frida/releases/download/%s/frida-gadget-%s-ios-universal.dylib.xz' % (version, version)
              print('качаю гаджет напрямую: %s' % dl)
              subprocess.run(['curl', '-fL', '--retry', '3', '--retry-delay', '2', '--max-time', '600', '-o', archive, dl], check=True)
              if os.path.getsize(archive) == 0:
                  raise SystemExit('пустой архив гаджета: %s' % archive)
              gadget.unpack().set_local_version('ios_universal', version).cleanup()

          size = os.path.getsize(gadget_path)
          print('gadget: %s (%d bytes)' % (gadget_path, size))

          p = IosPatcher(skip_cleanup=True)
          if not p.are_requirements_met():
              raise SystemExit('objection: не все внешние команды найдены (см. предупреждения выше)')

          def res(tag):
              print('--- ресурсы: %s ---' % tag)
              for d in (os.environ.get('GITHUB_WORKSPACE', '.'), os.path.dirname(p.temp_file)):
                  subprocess.run('df -h "%s" | tail -1' % d, shell=True)
              if shutil.which('vm_stat'):
                  subprocess.run('vm_stat | head -4', shell=True)

          res('до распаковки')
          print('распаковываю', ipa)
          p.extract_ipa(False, ipa_source=ipa)
          print('распаковано:', p.app_folder)
          for dup in (p.temp_file, ipa):
              try:
                  os.remove(dup)
                  print('дубликат удалён:', dup)
              except OSError as e:
                  print('не удалось удалить %s: %r' % (dup, e))
          res('после распаковки')
          p.set_application_binary()

          import shlex
          import time

          import delegator
          import lief

          # числа считаем только там, где LIEF разбирает файл уже с диска после записи:
          # предварительный разбор того же бинаря до патча может вернуть пустой список
          # библиотек, и тогда «новой записью» окажется всё, что есть в бинаре
          lc_applied = {}

          def add_lc(path, name):
              b = lief.MachO.parse(str(path)).at(0)
              before = len(b.libraries)
              b.add_library(name)
              b.remove_signature()
              b.write(str(path))
              c = lief.MachO.parse(str(path)).at(0)
              names = [x.name for x in c.libraries]
              if name not in names:
                  raise SystemExit('LC_LOAD_DYLIB не встал в %s: %d -> %d' % (path, before, len(names)))
              if len(names) != before + 1:
                  print('внимание: библиотек %d, ожидал %d — не совпало на единицу, но запись на месте' % (
                      len(names), before + 1))
              lc_applied['file'] = str(path)
              lc_applied['before'] = before
              lc_applied['after'] = len(names)
              print('  LC_LOAD_DYLIB %s (%d -> %d библиотек), chained fixups: %s' % (
                  name, before, len(names), c.has_dyld_chained_fixups))
              return names

          _real_run = delegator.run

          class _Result(object):
              def __init__(self, out='', err='', rc=0):
                  self.out = out
                  self.err = err
                  self.return_code = rc

          def _run(cmd, *args, **kwargs):
              if 'insert_dylib' not in cmd:
                  t0 = time.time()
                  r = _real_run(cmd, *args, **kwargs)
                  print('  %-22s rc=%s, %.1fs' % (cmd.split()[0].rsplit('/', 1)[-1], r.return_code, time.time() - t0))
                  return r
              argv = shlex.split(cmd)
              target = argv[-1]
              parsed = [a for a in argv if a.startswith('@executable_path/')]
              if not parsed or not os.path.exists(target):
                  raise SystemExit('не разобрал вызов insert_dylib: %r' % cmd)
              # objection 1.12.5 всегда вставляет @executable_path/Frameworks/FridaGadget.dylib:
              # это единственное место, где имя попадает в load command, — подменяем на путь
              # внутрь нашего фреймворка
              wanted = lc_path
              if parsed[0] != wanted:
                  print('  подмена имени в LC: %s -> %s' % (parsed[0], wanted))
              add_lc(target, wanted)
              return _Result('Added LC_LOAD_DYLIB %s' % wanted)

          delegator.run = _run
          print('вставляю LC_LOAD_DYLIB (LIEF) и подписываю dylib-ы (может занять минуты)...')
          p.patch_and_codesign_binary(
              frida_gadget=gadget_path,
              codesign_signature='-',
              gadget_config=cfg)
          print('LC и подписи готовы')

          wanted_lc = lc_path
          if not lc_applied:
              raise SystemExit('insert_dylib ни разу не вызвался — LC_LOAD_DYLIB не вставлен')

          # проверяем по тому файлу, который реально правили: p.app_binary у objection
          # может указывать не туда, а LIEF на нечитаемом пути отдаёт пустой объект
          # (0 библиотек) вместо ошибки — ровно на этом и падала прошлая проверка
          cands = []
          for cand in (lc_applied['file'], p.app_binary,
                       os.path.join(p.app_folder, os.environ.get('EXEC_NAME', ''))):
              s = str(cand or '')
              if s and s not in cands:
                  cands.append(s)
          checked = 0
          for cand in cands:
              if not os.path.exists(cand):
                  print('нет файла: %s' % cand)
                  continue
              try:
                  names_now = [c.name for c in lief.MachO.parse(cand).at(0).libraries]
              except Exception as e:
                  print('не разобрал %s: %r' % (cand, e))
                  continue
              if not names_now:
                  print('разобрал %s, но библиотек 0 — судить не могу' % cand)
                  continue
              checked += 1
              hits = names_now.count(wanted_lc)
              print('%s: библиотек %d, вхождений %r: %d' % (cand, len(names_now), wanted_lc, hits))
              if hits != 1:
                  raise SystemExit('в %s LC_LOAD_DYLIB на %r встречается %d раз (ожидал 1)' % (
                      cand, wanted_lc, hits))
              if len(names_now) != lc_applied['after']:
                  print('внимание: в %s библиотек %d, ожидал %d — список изменился после подписи' % (
                      cand, len(names_now), lc_applied['after']))
          if not checked:
              raise SystemExit('ни один бинарь из %r не прочитался — не могу подтвердить LC_LOAD_DYLIB' % cands)
          print('контроль: LC_LOAD_DYLIB на %s ровно один, бинарей проверено %d (было %d библиотек)' % (
              wanted_lc, checked, lc_applied['before']))
          res('после вставки LC')

          app = p.app_folder
          frameworks = os.path.join(app, 'Frameworks')

          # objection жёстко кладёт FridaGadget.dylib и FridaGadget.config в Frameworks,
          # поэтому переносим их в фреймворк сами: путь обязан совпасть с load command,
          # а гаджет внутри .framework берёт конфиг как config.json рядом с собой
          fw_dir = os.path.join(frameworks, fw_name)
          os.makedirs(fw_dir, exist_ok=True)
          for old, new in (('FridaGadget.dylib', dylib_name),
                           ('FridaGadget.config', stem + '.config')):
              src = os.path.join(frameworks, old)
              dst = os.path.join(fw_dir, new)
              if os.path.exists(dst):
                  continue
              if not os.path.exists(src):
                  raise SystemExit('нет ни %s, ни %s в Frameworks' % (old, new))
              os.replace(src, dst)
              print('перенесён в фреймворк: Frameworks/%s -> %s/%s' % (old, fw_name, new))

          shutil.copyfile(cfg, os.path.join(fw_dir, 'config.json'))
          shutil.copyfile(info_plist, os.path.join(fw_dir, 'Info.plist'))
          for stray in ('FridaGadget.dylib', 'FridaGadget.config'):
              if os.path.exists(os.path.join(frameworks, stray)):
                  raise SystemExit('в Frameworks остался %s — перенос в фреймворк не сработал' % stray)
          for stray in (dylib_name, 'config.json'):
              if os.path.exists(os.path.join(frameworks, stray)):
                  print('внимание: в Frameworks уже есть %s — это файл приложения, не трогаю' % stray)
          print('фреймворк собран: Frameworks/%s (%s, %s.config, config.json, Info.plist)' % (
              fw_name, dylib_name, stem))
          print('Frameworks: %r' % sorted(os.listdir(frameworks)))

          embed = (os.environ.get('SCRIPT_EMBED') or '1').strip() == '1'
          script_dir = (os.environ.get('SCRIPT_DIR_NORM') or '').strip()
          script_src = os.path.join('work', 'gadget', script_name)

          if not os.path.exists(script_src):
              print('скрипт не передан (script_file пустой)')
          elif not embed:
              print('скрипт не вшивается: положи его вручную в «На iPhone» -> <приложение>, имя %s' % script_name)
          else:
              target_dir = app if script_dir in ('', 'root') else os.path.join(app, script_dir)
              os.makedirs(target_dir, exist_ok=True)
              shutil.copyfile(script_src, os.path.join(target_dir, script_name))
              print('вшит скрипт:', os.path.relpath(os.path.join(target_dir, script_name), app))

          dest = app
          with open('work/patched-app-path.txt', 'w') as f:
              f.write(dest + '\n')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('APP_NAME=%s\n' % os.path.basename(app))
              f.write('PATCHED_APP_DIR=%s\n' % dest)
              f.write('GADGET_VERSION=%s\n' % version)
              f.write('GADGET_SIZE=%d\n' % size)
          print('inject ok ->', dest)
          PY

          echo "== содержимое бандла =="
          APPDIR="$(tail -1 work/patched-app-path.txt)"
          echo "бандл: $APPDIR"
          ls -la "$APPDIR"/ | head -40
          ls -la "$APPDIR"/Frameworks | head -40
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: ad-hoc sign and pack
        run: |
          set -euo pipefail
          APP="$PATCHED_APP_DIR"
          EXEC="$APP/$EXEC_NAME"
          [ -f "$EXEC" ] || { echo "нет исполняемого файла $EXEC"; exit 1; }
          df -h "$GITHUB_WORKSPACE" | tail -1

          ORIG_BIN="work/probe/$APP_DIR/$EXEC_NAME"
          [ -f "$ORIG_BIN" ] || { echo "нет нетронутого оригинала $ORIG_BIN"; exit 1; }
          ENTS=""
          if codesign -d --entitlements :- "$ORIG_BIN" > work/ents.plist 2>/dev/null \
             && [ -s work/ents.plist ] && [ "$(head -c 1 work/ents.plist)" = "<" ]; then
            ENTS="--entitlements work/ents.plist"
            echo "entitlements оригинала подключены"
          else
            echo "entitlements не найдены — подписываю без них"
          fi

          for d in "$APP/Frameworks" "$APP/PlugIns" "$APP/Watch"; do
            [ -d "$d" ] || continue
            find "$d" -type f -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                codesign -f -s - "$f"
              fi
            done
          done
          FW_PATH="$APP/Frameworks/$GADGET_FRAMEWORK"
          if [ -d "$FW_PATH" ]; then
            codesign -f -s - "$FW_PATH"
            echo "фреймворк подписан как бандл: $GADGET_FRAMEWORK"
          else
            echo "нет каталога $FW_PATH — гаджет лежит не фреймворком"; exit 1
          fi
          codesign -f -s - $ENTS "$EXEC"
          codesign -f -s - "$APP"

          echo "== ad-hoc подписи =="
          codesign -dvv "$EXEC" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvv "$APP" 2>&1 | grep -E 'Identifier|Signature' || true

          rm -rf work/build && mkdir -p work/build/Payload
          cp -R "$APP" work/build/Payload/
          OUT="$GITHUB_WORKSPACE/out/$(basename "${APP%.app}")-frida.ipa"
          (cd work/build && zip -qry "$OUT" Payload)
          echo "OUT_IPA=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT"

      - name: verify
        run: |
          set -euo pipefail
          rm -rf work/verify && mkdir -p work/verify
          unzip -q "$OUT_IPA" -d work/verify
          APP_VERIFY="work/verify/$APP_DIR"
          BIN_PATH="$APP_DIR/$EXEC_NAME"

          echo "== Frameworks =="
          ls -la "$APP_VERIFY/Frameworks"

          echo "== фреймворк гаджета =="
          ls -la "$APP_VERIFY/Frameworks/$GADGET_FRAMEWORK"

          for f in "Frameworks/$GADGET_FRAMEWORK/$GADGET_DYLIB" \
                   "Frameworks/$GADGET_FRAMEWORK/$GADGET_STEM.config" \
                   "Frameworks/$GADGET_FRAMEWORK/config.json" \
                   "Frameworks/$GADGET_FRAMEWORK/Info.plist"; do
            [ -f "$APP_VERIFY/$f" ] || { echo "в патченом IPA нет $f"; exit 1; }
          done
          for f in "Frameworks/$GADGET_DYLIB" "Frameworks/$GADGET_STEM.config"; do
            if [ -e "$APP_VERIFY/$f" ]; then
              echo "внимание: $f лежит в Frameworks вне фреймворка — это файл приложения,"
              echo "не наш гаджет: load command смотрит внутрь $GADGET_FRAMEWORK"
            fi
          done
          echo "== конфиг гаджета =="
          cat "$APP_VERIFY/Frameworks/$GADGET_FRAMEWORK/config.json"

          if [ "${SCRIPT_EMBED:-1}" = "1" ] && [ -n "$SCRIPT_FILE" ]; then
            case "$SCRIPT_DIR_NORM" in
              ""|root) SCRIPT_IN_IPA="$APP_VERIFY/$SCRIPT_NAME" ;;
              *) SCRIPT_IN_IPA="$APP_VERIFY/$SCRIPT_DIR_NORM/$SCRIPT_NAME" ;;
            esac
            [ -f "$SCRIPT_IN_IPA" ] || { echo "в патченом IPA нет скрипта $SCRIPT_IN_IPA"; exit 1; }
            echo "скрипт в IPA: ${SCRIPT_IN_IPA#$APP_VERIFY/}"
          elif [ "${SCRIPT_EMBED:-1}" = "0" ]; then
            echo "режим Documents: скрипт в IPA не вшит, ожидается вручную как $SCRIPT_NAME"
            if unzip -Z1 "$OUT_IPA" | grep -q "/$SCRIPT_NAME\$"; then
              echo "внимание: в IPA всё же найден файл $SCRIPT_NAME"
            fi
          fi

          echo "== frida-записи в итоговом IPA (должны быть только наши) =="
          unzip -Z1 "$OUT_IPA" | grep -i frida
          if unzip -Z1 "$OUT_IPA" | grep -qi 'Frida\.framework'; then
            echo "Frida.framework разработчика всё ещё в IPA"; exit 1
          fi
          if unzip -Z1 "$OUT_IPA" | grep -qi 'FridaGadget'; then
            echo "в IPA осталось имя FridaGadget — переименование гаджета не сработало:"
            unzip -Z1 "$OUT_IPA" | grep -i 'FridaGadget'
            exit 1
          fi
          FOREIGN="$(unzip -Z1 "$OUT_IPA" | grep -i frida \
            | grep -viE "Frameworks/${GADGET_FRAMEWORK}/" \
            | grep -v "${EXEC_NAME}$" \
            | grep -v "${SCRIPT_NAME}$" || true)"
          [ -z "$FOREIGN" ] || { echo "остались чужие frida-записи:"; echo "$FOREIGN"; exit 1; }

          echo "== load commands =="
          otool -l "work/verify/$BIN_PATH" | grep -A3 LC_LOAD_DYLIB | grep "$GADGET_FRAMEWORK/$GADGET_DYLIB" \
            || { echo "в бинаре нет LC_LOAD_DYLIB на $GADGET_FRAMEWORK/$GADGET_DYLIB"; exit 1; }
          if otool -l "work/verify/$BIN_PATH" | grep -A3 LC_LOAD_DYLIB | grep -qi 'Frida\.framework'; then
            echo "висячий LC_LOAD_DYLIB на Frida.framework остался"; exit 1
          fi
          otool -l "work/verify/$BIN_PATH" | grep -A2 LC_LOAD_DYLIB | grep -c 'name ' | sed 's/^/LC_LOAD_DYLIB всего: /'

          echo "== гаджет =="
          echo "версия: $GADGET_VERSION"
          python3 - <<'PY'
          import os, sys
          p = 'work/verify/%s/Frameworks/%s/%s' % (
              os.environ['APP_DIR'], os.environ['GADGET_FRAMEWORK'], os.environ['GADGET_DYLIB'])
          n = os.path.getsize(p)
          print('%s/%s %d bytes = %.2f MB' % (
              os.environ['GADGET_FRAMEWORK'], os.environ['GADGET_DYLIB'], n, n / 1048576.0))
          cap = float(os.environ['MAX_MB'])
          if cap > 0 and n / 1048576.0 > cap:
              print('больше лимита %.2f MB' % cap)
              sys.exit(1)
          PY

          echo "== подписи (ожидается adhoc) =="
          codesign -dvvv "$APP_VERIFY/Frameworks/$GADGET_FRAMEWORK/$GADGET_DYLIB" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvvv "$APP_VERIFY/Frameworks/$GADGET_FRAMEWORK" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvvv "$APP_VERIFY/$EXEC_NAME" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvvv "$APP_VERIFY" 2>&1 | grep -E 'Identifier|Signature' || true

          echo "== целостность =="
          unzip -tq "$OUT_IPA" >/dev/null && echo "zip ok"
          ls -l "$OUT_IPA"

      - name: upload exec
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exec
          path: exe/*
          compression-level: 0
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FridaGadget-${{ inputs.version || 'latest' }}-${{ github.run_number }}
          path: |
            out/*.ipa
            work/gadget/*.config
            work/gadget/*.json
            work/gadget/*.plist
            work/strip.log
            work/probe
          if-no-files-found: warn
          compression-level: 0
