name: FridaGadget

on:
  workflow_dispatch:
    inputs:
      url:
        description: ipa endpoint
        required: false
        default: https://nulls.ee/bs_latest_i
      version:
        description: тег Frida; пусто = последний релиз
        default: ""
      drop_lc:
        description: вырезать загрузку Frida.framework разработчика IPA
        type: boolean
        default: true
      custom_gadget_url:
        description: "необязательно: URL своей сборки FridaGadget.dylib (релизная не качается)"
        default: ""
      max_mb:
        description: упасть, если dylib гаджета в итоговом IPA больше, МБ (0 = не проверять)
        default: "60"
      script:
        description: имя JS-файла в бандле (это же имя идёт в "path" конфига)
        default: "agent.js"
      script_file:
        description: "необязательно: путь к .js в репозитории, который вшить в бандл"
        default: ""
      script_dir:
        description: "Documents (На iPhone -> приложение, не вшивается) | Frameworks | root | своя папка в .app"
        default: "Documents"
      code_signing:
        description: режим code_signing в конфиге гаджета
        default: "required"

jobs:
  patch:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      OBJECTION_VERSION: "1.12.5"
      IPA_URL: ${{ inputs.url }}
      FRIDA_VERSION: ${{ inputs.version }}
      CUSTOM_GADGET_URL: ${{ inputs.custom_gadget_url }}
      MAX_MB: ${{ inputs.max_mb }}
      SCRIPT_NAME: ${{ inputs.script }}
      SCRIPT_FILE: ${{ inputs.script_file }}
      SCRIPT_DIR: ${{ inputs.script_dir }}
      CODE_SIGNING: ${{ inputs.code_signing }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: toolchain
        run: |
          set -euo pipefail
          mkdir -p work out

          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet lief "objection==${OBJECTION_VERSION}"

          git clone --depth 1 https://github.com/Tyilo/insert_dylib insert_dylib-src
          (cd insert_dylib-src && xcodebuild -configuration Release >/dev/null)
          BIN="$(find insert_dylib-src -type f -name insert_dylib -perm -111 | head -1)"
          [ -n "$BIN" ] || { echo "insert_dylib не собрался"; exit 1; }
          sudo cp -f "$BIN" /usr/local/bin/insert_dylib
          chmod +x /usr/local/bin/insert_dylib

          python3 -c 'import lief; print("lief", lief.__version__)'
          objection version 2>&1 | tail -1 || true
          npm install -g applesign
          for c in insert_dylib codesign security zip unzip plutil xcodebuild applesign; do
            command -v "$c" || { echo "нет обязательной команды: $c"; exit 1; }
          done

      - name: fetch
        run: |
          set -euo pipefail
          python3 tools/ExecutablePatch.py --resolve "$IPA_URL" | tee work/url.txt
          curl -fL --retry 3 --retry-delay 5 --max-time 900 -o work/app.ipa "$(tail -1 work/url.txt)"
          ls -l work/app.ipa

          unzip -tq work/app.ipa >/dev/null
          APP_INFO="$(unzip -Z1 work/app.ipa | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -1)"
          [ -n "$APP_INFO" ] || { echo "в IPA нет Payload/*.app/Info.plist"; exit 1; }
          APP_DIR="${APP_INFO%/Info.plist}"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "бандл: $APP_DIR"

          mkdir -p work/probe
          unzip -o -q work/app.ipa "$APP_DIR/Info.plist" -d work/probe
          python3 - <<'PY'
          import plistlib, pathlib, os
          p = next(pathlib.Path('work/probe/Payload').glob('*.app/Info.plist'))
          d = plistlib.loads(p.read_bytes())
          print('CFBundleIdentifier:', d.get('CFBundleIdentifier'))
          print('CFBundleExecutable:', d.get('CFBundleExecutable'))
          print('CFBundleShortVersionString:', d.get('CFBundleShortVersionString'))
          with open('work/exec-name.txt', 'w') as f:
              f.write(d.get('CFBundleExecutable') or '')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('BUNDLE_ID_ORIG=%s\n' % d.get('CFBundleIdentifier'))
              f.write('EXEC_NAME=%s\n' % d.get('CFBundleExecutable'))
          PY

          BIN_PATH="$APP_DIR/$(cat work/exec-name.txt)"
          unzip -o -q work/app.ipa "$BIN_PATH" -d work/probe
          CRYPTID="$(otool -l "work/probe/$BIN_PATH" | awk '/LC_ENCRYPTION_INFO/{f=1} f&&/^ *cryptid/{print $2; exit}')"
          echo "cryptid=${CRYPTID:-<нет LC_ENCRYPTION_INFO>}"
          if [ "${CRYPTID:-0}" != "0" ]; then
            echo "IPA зашифрован FairPlay (cryptid=$CRYPTID). Патч и переподпись бессмысленны —"
            echo "нужен расшифрованный дамп. Прерываю."
            exit 1
          fi

          echo "== frida-записи в исходном IPA =="
          unzip -Z1 work/app.ipa | grep -i frida | sed -n '1,20p' || echo "(нет)"

      - name: strip developer frida
        run: |
          set -euo pipefail
          ARGS=(--ipa work/app.ipa --exe-dir exe --out work/nofrida.ipa)
          if [ "${{ inputs.drop_lc }}" = "true" ]; then
            ARGS+=(--drop-lc)
          else
            echo "внимание: drop_lc=false, висячий LC_LOAD_DYLIB останется и приложение не запустится"
          fi
          python3 tools/ExecutablePatch.py "${ARGS[@]}" | tee work/strip.log
          ls -l work/nofrida.ipa exe/
          rm -f work/app.ipa
          echo "исходный work/app.ipa удалён; нетронутый исполняемый файл лежит в work/probe"
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: gadget config
        run: |
          set -euo pipefail
          mkdir -p work/gadget
          DIR="${SCRIPT_DIR:-Documents}"
          DIR="${DIR#/}"
          DIR="${DIR%/}"
          LC="$(printf '%s' "$DIR" | tr '[:upper:]' '[:lower:]')"
          EMBED=1
          case "$LC" in
            ""|documents)
              PATH_VALUE="$SCRIPT_NAME"
              DIR="Documents"
              EMBED=0
              ;;
            frameworks)
              PATH_VALUE="$SCRIPT_NAME"
              DIR="Frameworks"
              ;;
            root|".")
              PATH_VALUE="../$SCRIPT_NAME"
              DIR="root"
              ;;
            *)
              PATH_VALUE="../$DIR/$SCRIPT_NAME"
              ;;
          esac
          echo "скрипт: $DIR | path в конфиге: $PATH_VALUE | вшивается в IPA: $EMBED"
          echo "SCRIPT_DIR_NORM=$DIR" >> "$GITHUB_ENV"
          echo "SCRIPT_EMBED=$EMBED" >> "$GITHUB_ENV"
          cat > work/gadget/FridaGadget.config <<CFG
          {
            "interaction": {
              "type": "script",
              "path": "$PATH_VALUE",
              "on_change": "reload",
              "parameters": {}
            },
            "code_signing": "$CODE_SIGNING"
          }
          CFG
          cat work/gadget/FridaGadget.config

          if [ -n "$SCRIPT_FILE" ]; then
            [ -f "$SCRIPT_FILE" ] || { echo "нет файла скрипта: $SCRIPT_FILE"; exit 1; }
            cp "$SCRIPT_FILE" "work/gadget/$SCRIPT_NAME"
            ls -l "work/gadget/$SCRIPT_NAME"
          fi

      - name: custom gadget (optional)
        if: inputs.custom_gadget_url != ''
        run: |
          set -euo pipefail
          GP="$(python3 -c 'from objection.utils.patchers.ios import IosGadget; print(IosGadget.ios_dylib_gadget_path)')"
          echo "objection gadget path: $GP"
          mkdir -p "$(dirname "$GP")"
          curl -fL --retry 3 --max-time 600 "$CUSTOM_GADGET_URL" -o "$GP"
          lipo -archs "$GP" || true
          ls -l "$GP"

      - name: inject
        env:
          IPA_PATH: work/nofrida.ipa
          GADGET_CONFIG: work/gadget/FridaGadget.config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess

          import requests
          from objection.utils.patchers.github import Github
          from objection.utils.patchers.ios import IosGadget, IosPatcher

          token = (os.environ.get('GITHUB_TOKEN') or '').strip()
          _s = requests.Session()
          _s.headers.update({
              'User-Agent': 'Nulls-Frida-Workflow',
              'Accept': 'application/vnd.github+json',
          })
          if token:
              _s.headers['Authorization'] = 'Bearer ' + token
          requests.get = _s.get

          def resolve_version():
              want = (os.environ.get('FRIDA_VERSION') or '').strip()
              if want:
                  return want
              try:
                  r = requests.get('https://api.github.com/repos/frida/frida/releases/latest', timeout=30)
                  print('github api: status %s, rate-limit remaining %s' % (
                      r.status_code, r.headers.get('x-ratelimit-remaining', 'n/a')))
                  tag = r.json().get('tag_name')
                  if tag:
                      return tag
                  print('github api: ответ без tag_name:', r.text[:300])
              except Exception as e:
                  print('github api недоступен: %r' % e)
              try:
                  r = requests.get('https://github.com/frida/frida/releases/latest', timeout=30)
                  tag = r.url.rstrip('/').rsplit('/', 1)[-1]
                  if re.fullmatch(r'\d+\.\d+\.\d+', tag):
                      print('версия из редиректа releases/latest:', tag)
                      return tag
                  print('редирект не дал версию:', r.url)
              except Exception as e:
                  print('редирект недоступен: %r' % e)
              raise SystemExit('не удалось определить последнюю версию Frida')

          ipa = os.environ['IPA_PATH']
          cfg = os.environ['GADGET_CONFIG']
          script_name = os.environ['SCRIPT_NAME']
          custom = (os.environ.get('CUSTOM_GADGET_URL') or '').strip()

          if custom:
              version = (os.environ.get('FRIDA_VERSION') or '').strip() or 'custom'
          else:
              version = resolve_version()
          if version != 'custom' and not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('подозрительный номер версии: %r' % version)
          print('frida release:', version)

          gadget = IosGadget(Github(gadget_version=version))
          gadget_path = gadget.get_gadget_path()
          archive = os.path.join(os.path.expanduser('~'), '.objection', 'ios', 'FridaGadget.dylib.xz')

          if custom:
              if not os.path.exists(gadget_path):
                  raise SystemExit('нет файла своей сборки гаджета: %s' % gadget_path)
              print('использую свою сборку:', gadget_path)
          elif gadget.gadget_exists() and gadget.get_local_version('ios_universal') == version:
              print('гаджет уже в кэше:', gadget_path)
          else:
              dl = 'https://github.com/frida/frida/releases/download/%s/frida-gadget-%s-ios-universal.dylib.xz' % (version, version)
              print('качаю гаджет напрямую: %s' % dl)
              subprocess.run(['curl', '-fL', '--retry', '3', '--retry-delay', '2', '--max-time', '600', '-o', archive, dl], check=True)
              if os.path.getsize(archive) == 0:
                  raise SystemExit('пустой архив гаджета: %s' % archive)
              gadget.unpack().set_local_version('ios_universal', version).cleanup()

          size = os.path.getsize(gadget_path)
          print('gadget: %s (%d bytes)' % (gadget_path, size))

          p = IosPatcher(skip_cleanup=True)
          if not p.are_requirements_met():
              raise SystemExit('objection: не все внешние команды найдены (см. предупреждения выше)')

          def res(tag):
              print('--- ресурсы: %s ---' % tag)
              for d in (os.environ.get('GITHUB_WORKSPACE', '.'), os.path.dirname(p.temp_file)):
                  subprocess.run('df -h "%s" | tail -1' % d, shell=True)
              if shutil.which('vm_stat'):
                  subprocess.run('vm_stat | head -4', shell=True)

          res('до распаковки')
          print('распаковываю', ipa)
          p.extract_ipa(False, ipa_source=ipa)
          print('распаковано:', p.app_folder)
          for dup in (p.temp_file, ipa):
              try:
                  os.remove(dup)
                  print('дубликат удалён:', dup)
              except OSError as e:
                  print('не удалось удалить %s: %r' % (dup, e))
          res('после распаковки')
          p.set_application_binary()
          print('вставляю LC_LOAD_DYLIB и подписываю dylib-ы (может занять минуты)...')
          p.patch_and_codesign_binary(
              frida_gadget=gadget_path,
              codesign_signature='-',
              gadget_config=cfg)
          print('LC и подписи готовы')
          res('после вставки LC')

          app = p.app_folder
          frameworks = os.path.join(app, 'Frameworks')

          shutil.copyfile(cfg, os.path.join(frameworks, 'config.json'))

          embed = (os.environ.get('SCRIPT_EMBED') or '1').strip() == '1'
          script_dir = (os.environ.get('SCRIPT_DIR_NORM') or '').strip()
          script_src = os.path.join('work', 'gadget', script_name)

          if not os.path.exists(script_src):
              print('скрипт не передан (script_file пустой)')
          elif not embed:
              print('скрипт не вшивается: положи его вручную в «На iPhone» -> <приложение>, имя %s' % script_name)
          else:
              target_dir = app if script_dir in ('', 'root') else os.path.join(app, script_dir)
              os.makedirs(target_dir, exist_ok=True)
              shutil.copyfile(script_src, os.path.join(target_dir, script_name))
              print('вшит скрипт:', os.path.relpath(os.path.join(target_dir, script_name), app))

          dest = app
          with open('work/patched-app-path.txt', 'w') as f:
              f.write(dest + '\n')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('APP_NAME=%s\n' % os.path.basename(app))
              f.write('PATCHED_APP_DIR=%s\n' % dest)
              f.write('GADGET_VERSION=%s\n' % version)
              f.write('GADGET_SIZE=%d\n' % size)
          print('inject ok ->', dest)
          PY

          echo "== содержимое бандла =="
          APPDIR="$(tail -1 work/patched-app-path.txt)"
          echo "бандл: $APPDIR"
          ls -la "$APPDIR"/ | head -40
          ls -la "$APPDIR"/Frameworks | head -40
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: ad-hoc sign and pack
        run: |
          set -euo pipefail
          APP="$PATCHED_APP_DIR"
          EXEC="$APP/$EXEC_NAME"
          [ -f "$EXEC" ] || { echo "нет исполняемого файла $EXEC"; exit 1; }
          df -h "$GITHUB_WORKSPACE" | tail -1

          ORIG_BIN="work/probe/$APP_DIR/$EXEC_NAME"
          [ -f "$ORIG_BIN" ] || { echo "нет нетронутого оригинала $ORIG_BIN"; exit 1; }
          ENTS=""
          if codesign -d --entitlements :- "$ORIG_BIN" > work/ents.plist 2>/dev/null \
             && [ -s work/ents.plist ] && [ "$(head -c 1 work/ents.plist)" = "<" ]; then
            ENTS="--entitlements work/ents.plist"
            echo "entitlements оригинала подключены"
          else
            echo "entitlements не найдены — подписываю без них"
          fi

          for d in "$APP/Frameworks" "$APP/PlugIns" "$APP/Watch"; do
            [ -d "$d" ] || continue
            find "$d" -type f -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                codesign -f -s - "$f"
              fi
            done
          done
          codesign -f -s - $ENTS "$EXEC"
          codesign -f -s - "$APP"

          echo "== ad-hoc подписи =="
          codesign -dvv "$EXEC" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvv "$APP" 2>&1 | grep -E 'Identifier|Signature' || true

          rm -rf work/build && mkdir -p work/build/Payload
          cp -R "$APP" work/build/Payload/
          OUT="$GITHUB_WORKSPACE/out/$(basename "${APP%.app}")-frida.ipa"
          (cd work/build && zip -qry "$OUT" Payload)
          echo "OUT_IPA=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT"

      - name: verify
        run: |
          set -euo pipefail
          rm -rf work/verify && mkdir -p work/verify
          unzip -q "$OUT_IPA" -d work/verify
          APP_VERIFY="work/verify/$APP_DIR"
          BIN_PATH="$APP_DIR/$EXEC_NAME"

          echo "== Frameworks =="
          ls -la "$APP_VERIFY/Frameworks"

          for f in Frameworks/FridaGadget.dylib Frameworks/FridaGadget.config Frameworks/config.json; do
            [ -f "$APP_VERIFY/$f" ] || { echo "в патченом IPA нет $f"; exit 1; }
          done
          echo "== конфиг гаджета =="
          cat "$APP_VERIFY/Frameworks/FridaGadget.config"

          if [ "${SCRIPT_EMBED:-1}" = "1" ] && [ -n "$SCRIPT_FILE" ]; then
            case "$SCRIPT_DIR_NORM" in
              ""|root) SCRIPT_IN_IPA="$APP_VERIFY/$SCRIPT_NAME" ;;
              *) SCRIPT_IN_IPA="$APP_VERIFY/$SCRIPT_DIR_NORM/$SCRIPT_NAME" ;;
            esac
            [ -f "$SCRIPT_IN_IPA" ] || { echo "в патченом IPA нет скрипта $SCRIPT_IN_IPA"; exit 1; }
            echo "скрипт в IPA: ${SCRIPT_IN_IPA#$APP_VERIFY/}"
          elif [ "${SCRIPT_EMBED:-1}" = "0" ]; then
            echo "режим Documents: скрипт в IPA не вшит, ожидается вручную как $SCRIPT_NAME"
            if unzip -Z1 "$OUT_IPA" | grep -q "/$SCRIPT_NAME\$"; then
              echo "внимание: в IPA всё же найден файл $SCRIPT_NAME"
            fi
          fi

          echo "== frida-записи в итоговом IPA (должны быть только наши) =="
          unzip -Z1 "$OUT_IPA" | grep -i frida
          if unzip -Z1 "$OUT_IPA" | grep -qi 'Frida\.framework'; then
            echo "Frida.framework разработчика всё ещё в IPA"; exit 1
          fi
          FOREIGN="$(unzip -Z1 "$OUT_IPA" | grep -i frida \
            | grep -viE 'Frameworks/(FridaGadget\.dylib|FridaGadget\.config|config\.json)' \
            | grep -v "${EXEC_NAME}$" \
            | grep -v "${SCRIPT_NAME}$" || true)"
          [ -z "$FOREIGN" ] || { echo "остались чужие frida-записи:"; echo "$FOREIGN"; exit 1; }

          echo "== load commands =="
          otool -l "work/verify/$BIN_PATH" | grep -A3 LC_LOAD_DYLIB | grep -i frida \
            || { echo "в бинаре нет LC_LOAD_DYLIB на FridaGadget"; exit 1; }
          if otool -l "work/verify/$BIN_PATH" | grep -A3 LC_LOAD_DYLIB | grep -qi 'Frida\.framework'; then
            echo "висячий LC_LOAD_DYLIB на Frida.framework остался"; exit 1
          fi
          otool -l "work/verify/$BIN_PATH" | grep -A2 LC_LOAD_DYLIB | grep -c 'name ' | sed 's/^/LC_LOAD_DYLIB всего: /'

          echo "== гаджет =="
          echo "версия: $GADGET_VERSION"
          python3 - <<'PY'
          import os, sys
          p = 'work/verify/%s/Frameworks/FridaGadget.dylib' % os.environ['APP_DIR']
          n = os.path.getsize(p)
          print('FridaGadget %d bytes = %.2f MB' % (n, n / 1048576.0))
          cap = float(os.environ['MAX_MB'])
          if cap > 0 and n / 1048576.0 > cap:
              print('больше лимита %.2f MB' % cap)
              sys.exit(1)
          PY

          echo "== подписи (ожидается adhoc) =="
          codesign -dvvv "$APP_VERIFY/Frameworks/FridaGadget.dylib" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvvv "$APP_VERIFY/$EXEC_NAME" 2>&1 | grep -E 'Identifier|Signature' || true
          codesign -dvvv "$APP_VERIFY" 2>&1 | grep -E 'Identifier|Signature' || true

          echo "== целостность =="
          unzip -tq "$OUT_IPA" >/dev/null && echo "zip ok"
          ls -l "$OUT_IPA"

      - name: upload exec
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exec
          path: exe/*
          compression-level: 0
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FridaGadget-${{ inputs.version || 'latest' }}-${{ github.run_number }}
          path: |
            out/*.ipa
            work/gadget/FridaGadget.config
            work/strip.log
            work/probe
          if-no-files-found: warn
          compression-level: 0
